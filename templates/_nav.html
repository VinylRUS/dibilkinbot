{# Общий навбар с dropdown-группами.
   Принимает: user (dict с is_admin), active (опционально) #}
<nav class="top">
  <span class="brand">DeeBeelkin</span>

  <!-- Группа: Комьюнити -->
  <div class="nav-group">
    <button class="nav-group-btn" onclick="toggleNavGroup(this)">
      Комьюнити <span class="chevron">▼</span>
    </button>
    <div class="dropdown">
      <a href="/wheel" {% if active == 'wheel' %}class="active"{% endif %}>Колесо</a>
      <a href="/winners" {% if active == 'winners' %}class="active"{% endif %}>Победители</a>
      <a href="/watched" {% if active == 'watched' %}class="active"{% endif %}>Бэклог</a>
      <a href="/quotes" {% if active == 'quotes' %}class="active"{% endif %}>Цитаты</a>
    </div>
  </div>

  <!-- Группа: Бот (только админ) -->
  {% if user.is_admin %}
  <div class="nav-group">
    <button class="nav-group-btn" onclick="toggleNavGroup(this)">
      Бот <span class="chevron">▼</span>
    </button>
    <div class="dropdown">
      <a href="/tokens" {% if active == 'tokens' %}class="active"{% endif %}>Токены</a>
      <a href="/channels" {% if active == 'channels' %}class="active"{% endif %}>Каналы</a>
      <a href="/features" {% if active == 'features' %}class="active"{% endif %}>Фичи</a>
      <a href="/users" {% if active == 'users' %}class="active"{% endif %}>Юзеры</a>
      <a href="/guilds" {% if active == 'guilds' %}class="active"{% endif %}>Серверы</a>
    </div>
  </div>
  {% endif %}

  <a href="/profile" {% if active == 'profile' %}style="color: var(--accent);"{% endif %}>Профиль</a>

  <form method="post" action="/theme" style="display:inline; margin: 0;">
    <button type="submit" name="theme" value="{{ 'light' if theme_from_request(request) == 'dark' else 'dark' }}" class="theme-toggle">
      {{ '☀️' if theme_from_request(request) == 'dark' else '🌙' }}
    </button>
  </form>

  <span class="right">
    👤 {{ user.username }}
    <a href="/logout">Выйти</a>
  </span>
</nav>

<script>
function toggleNavGroup(btn) {
  const group = btn.parentElement;
  document.querySelectorAll('.nav-group.open').forEach(g => {
    if (g !== group) g.classList.remove('open');
  });
  group.classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.nav-group')) {
    document.querySelectorAll('.nav-group.open').forEach(g => g.classList.remove('open'));
  }
});
</script>
