<!DOCTYPE html>
<html lang="ru" data-theme="{{ theme_from_request(request) }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бэклог · DeeBeelkin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include "_nav.html" %}

  <main class="container">
    <h2>🎬 Бэклог просмотренных фильмов</h2>
    <article class="card">
      <table>
        <tr><th>Название</th><th>Дата</th><th>Оценка</th></tr>
        {% for title, watched_at, rating in watched %}
          <tr>
            <td>{{ title }}</td>
            <td class="mono">{{ watched_at[:16].replace('T', ' ') }}</td>
            <td>{{ '⭐' * rating if rating else '—' }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="empty">Бэклог пуст.</td></tr>
        {% endfor %}
      </table>
    </article>
  </main>
</body>
</html>
