<!DOCTYPE html>
<html lang="ru" data-theme="{{ theme_from_request(request) }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · DeeBeelkin</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 24px 0;
      font-size: 1.6rem;
      color: var(--accent);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1::before { content: "🐝"; font-size: 1.4rem; }
    .error {
      background: var(--badge-unconfirmed-bg);
      color: var(--red);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    .hint { color: var(--text-muted); font-size: 0.8rem; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login">
    <h1>DeeBeelkin</h1>
    {% if error %}
      <div class="error">Неверный логин или пароль.</div>
    {% endif %}
    <label for="login">Логин или Discord ID</label>
    <input id="login" name="login" type="text" autocomplete="username" required autofocus placeholder="admin или ваш Discord ID">
    <label for="password">Пароль (только для админа)</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="оставьте пустым если входите по Discord ID">
    <button type="submit">Войти</button>
    <p class="hint">
      Вход для админа: логин+пароль из env-переменных.<br>
      Вход для участников: ваш Discord ID (без пароля), если вас уже добавил админ.
    </p>
  </form>
</body>
</html>
