<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход · Kinovecher</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #313244;
      padding: 32px;
      border-radius: 12px;
      width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 24px 0; font-size: 22px; font-weight: 600; text-align: center; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #a6adc8; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; margin-bottom: 16px;
      background: #1e1e2e; border: 1px solid #45475a;
      border-radius: 6px; color: #cdd6f4; font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #89b4fa; }
    button {
      width: 100%; padding: 11px; background: #89b4fa; color: #1e1e2e;
      border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #74c7ec; }
    .error {
      background: #f38ba8; color: #1e1e2e; padding: 10px 12px;
      border-radius: 6px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Kinovecher</h1>
    {% if error %}
      <div class="error">Неверный логин или пароль.</div>
    {% endif %}
    <label for="login">Логин</label>
    <input id="login" name="login" type="text" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
