name: Lint

on:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check for missing icons in templates
      run: |
        python -c "
        import os, re
        missing = 0
        for root, dirs, files in os.walk('templates'):
            for f in files:
                if f.endswith('.html'):
                    path = os.path.join(root, f)
                    with open(path) as fh:
                        content = fh.read()
                    icons = re.findall(r'/static/icons/([a-z_]+\.png)', content)
                    for icon in set(icons):
                        icon_path = os.path.join('static', 'icons', icon)
                        if not os.path.exists(icon_path):
                            print(f'MISSING: {path} → {icon}')
                            missing += 1
        if missing:
            import sys; sys.exit(1)
        print('All icons found ✓')
        "

    - name: Check Jinja2 templates compile
      run: |
        pip install jinja2
        python -c "
        from jinja2 import Environment, FileSystemLoader
        import os, sys
        env = Environment(loader=FileSystemLoader('templates'))
        failed = 0
        for f in os.listdir('templates'):
            if f.endswith('.html'):
                try:
                    env.get_template(f)
                except Exception as e:
                    print(f'FAIL: {f} — {e}')
                    failed += 1
        if failed:
            sys.exit(1)
        print('All templates compile ✓')
        "

    - name: Check no Jinja2 in JS files
      run: |
        python -c "
        import os, sys
        failed = 0
        for root, dirs, files in os.walk('static/js'):
            for f in files:
                if f.endswith('.js'):
                    path = os.path.join(root, f)
                    with open(path) as fh:
                        content = fh.read()
                    if '{{' in content or '{%' in content:
                        print(f'JINJA2 IN JS: {path}')
                        failed += 1
        if failed:
            sys.exit(1)
        print('No Jinja2 in JS files ✓')
        "
