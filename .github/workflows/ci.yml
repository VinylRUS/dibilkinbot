name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx aiosqlite itsdangerous cryptography python-multipart
        pip install fastapi uvicorn discord.py

    - name: Syntax check all Python files
      run: |
        python -c "
        import ast, sys, os
        failed = 0
        for root, dirs, files in os.walk('.'):
            if '.git' in root or 'node_modules' in root:
                continue
            for f in files:
                if f.endswith('.py'):
                    path = os.path.join(root, f)
                    try:
                        ast.parse(open(path).read())
                    except SyntaxError as e:
                        print(f'FAIL: {path} line {e.lineno}: {e.msg}')
                        failed += 1
        if failed:
            sys.exit(1)
        print('All Python files: syntax OK')
        "

    - name: Run v2.4.0 tests
      run: python scripts/test_v240.py
